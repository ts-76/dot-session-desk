<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#537BA2"/></marker></defs><rect width="1800" height="1200" fill="#F6F7F9"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="64" y="78" font-size="24" font-weight="700" fill="#537BA2" text-anchor="start">SESSION DESK</text><text x="64" y="139" font-size="49" font-weight="700" fill="#313943" text-anchor="start">会話と返信が届くしくみ</text><text x="64" y="194" font-size="27" font-weight="400" fill="#65717D" text-anchor="start">オーナー専用のHTTPS Siteに会話を保存し、新着通知でdotが返信</text><rect x="64" y="267" width="386" height="340" rx="20" fill="#fff" stroke="#CFD5DC" stroke-width="2"/><text x="96" y="322" font-size="33" font-weight="700" fill="#313943" text-anchor="start">ブラウザ</text><text x="96" y="368" font-size="24" font-weight="400" fill="#65717D" text-anchor="start">Mac / iPhone / Linux</text><line x1="96" y1="401" x2="418" y2="401" stroke="#E0E4E9" stroke-width="2"/><text x="96" y="450" font-size="26" font-weight="400" fill="#313943" text-anchor="start">メッセージを送信</text><text x="96" y="498" font-size="26" font-weight="400" fill="#313943" text-anchor="start">会話履歴を表示</text><text x="96" y="563" font-size="23" font-weight="500" fill="#537BA2" text-anchor="start">約2秒ごとに返信を確認</text><rect x="690" y="267" width="440" height="340" rx="20" fill="#fff" stroke="#CFD5DC" stroke-width="2"/><text x="724" y="322" font-size="32" font-weight="700" fill="#313943" text-anchor="start">Session Desk Site</text><rect x="724" y="350" width="372" height="77" rx="12" fill="#EDF2F7" stroke="#D3DEE9" stroke-width="2"/><text x="750" y="397" font-size="26" font-weight="500" fill="#313943" text-anchor="start">Sites認証：入口を保護</text><text x="724" y="479" font-size="30" font-weight="700" fill="#313943" text-anchor="start">Cloudflare Worker</text><text x="724" y="525" font-size="24" font-weight="400" fill="#313943" text-anchor="start">画面・ブラウザAPI・MCP</text><text x="724" y="568" font-size="24" font-weight="400" fill="#65717D" text-anchor="start">会話の保存と通知を担当</text><rect x="1380" y="267" width="356" height="340" rx="20" fill="#fff" stroke="#CFD5DC" stroke-width="2"/><text x="1412" y="322" font-size="31" font-weight="700" fill="#313943" text-anchor="start">D1 データベース</text><text x="1412" y="402" font-size="26" font-weight="400" fill="#313943" text-anchor="start">会話ごとの情報</text><text x="1412" y="451" font-size="24" font-weight="400" fill="#313943" text-anchor="start">ユーザーのメッセージ</text><text x="1412" y="500" font-size="26" font-weight="400" fill="#313943" text-anchor="start">dotの返信</text><text x="1412" y="562" font-size="23" font-weight="500" fill="#537BA2" text-anchor="start">履歴を永続保存</text><rect x="690" y="810" width="440" height="190" rx="20" fill="#fff" stroke="#CFD5DC" stroke-width="2"/><text x="722" y="857" font-size="30" font-weight="700" fill="#313943" text-anchor="start">新着通知・返信処理</text><text x="722" y="909" font-size="24" font-weight="400" fill="#313943" text-anchor="start">OpenAIの通知受信先</text><text x="722" y="956" font-size="23" font-weight="400" fill="#65717D" text-anchor="start">保存済みの自動処理が起動</text><rect x="1380" y="810" width="356" height="190" rx="20" fill="#EDF2F7" stroke="#B6C9DB" stroke-width="2"/><text x="1412" y="862" font-size="40" font-weight="700" fill="#426B94" text-anchor="start">dot</text><text x="1412" y="916" font-size="26" font-weight="400" fill="#313943" text-anchor="start">履歴を読んで返信</text><text x="1412" y="962" font-size="24" font-weight="400" fill="#65717D" text-anchor="start">全セッションで共通</text><path d="M450 394 H684" fill="none" stroke="#537BA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><circle cx="488" cy="343" r="20" fill="#537BA2"/><text x="488" y="352" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="521" y="352" font-size="27" font-weight="700" fill="#313943" text-anchor="start">投稿</text><text x="570" y="436" font-size="18" font-weight="400" fill="#65717D" text-anchor="middle">POST /api/threads/:id</text><path d="M1130 420 H1374" fill="none" stroke="#537BA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><circle cx="1170" cy="367" r="20" fill="#537BA2"/><text x="1170" y="376" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1203" y="376" font-size="25" font-weight="700" fill="#313943" text-anchor="start">保存・読出し</text><path d="M1380 484 H1136" fill="none" stroke="#537BA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="1255" y="531" font-size="21" font-weight="400" fill="#65717D" text-anchor="middle">履歴・完成した返信</text><path d="M870 607 V804" fill="none" stroke="#537BA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><circle cx="567" cy="669" r="20" fill="#537BA2"/><text x="567" y="678" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="600" y="679" font-size="23" font-weight="700" fill="#313943" text-anchor="start">署名付きWebhook</text><text x="600" y="720" font-size="23" font-weight="400" fill="#65717D" text-anchor="start">message.created</text><path d="M1130 915 H1374" fill="none" stroke="#537BA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><circle cx="1177" cy="858" r="20" fill="#537BA2"/><text x="1177" y="867" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1210" y="868" font-size="24" font-weight="700" fill="#313943" text-anchor="start">dotを起動</text><path d="M1558 810 V674 H1050 V613" fill="none" stroke="#537BA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><circle cx="1254" cy="621" r="20" fill="#537BA2"/><text x="1254" y="630" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1287" y="630" font-size="25" font-weight="700" fill="#313943" text-anchor="start">認証済みSite MCP</text><text x="1349" y="721" font-size="23" font-weight="500" fill="#537BA2" text-anchor="middle">read_thread → append_reply</text><text x="1381" y="763" font-size="21" font-weight="400" fill="#65717D" text-anchor="middle">履歴を取得 → 日本語の返信を保存</text><path d="M690 535 H456" fill="none" stroke="#537BA2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><circle cx="489" cy="483" r="20" fill="#537BA2"/><text x="489" y="492" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="522" y="492" font-size="26" font-weight="700" fill="#313943" text-anchor="start">返信取得</text><text x="570" y="577" font-size="18" font-weight="400" fill="#65717D" text-anchor="middle">GET /api/threads/:id</text><text x="80" y="725" font-size="27" font-weight="700" fill="#313943" text-anchor="start">接続はSite経由</text><text x="80" y="770" font-size="22" font-weight="400" fill="#65717D" text-anchor="start">dot側Linuxは公開サーバーではない</text><text x="80" y="805" font-size="22" font-weight="400" fill="#65717D" text-anchor="start">ブラウザとの直接接続なし</text><text x="80" y="858" font-size="23" font-weight="400" fill="#65717D" text-anchor="start">WebSocket / SSEは使わず</text><text x="80" y="900" font-size="24" font-weight="400" fill="#65717D" text-anchor="start">完成した返信を取得</text><text x="80" y="947" font-size="21" font-weight="400" fill="#65717D" text-anchor="start">会話ごとの専用エージェントではなく、</text><text x="80" y="982" font-size="24" font-weight="500" fill="#313943" text-anchor="start">同じdotが各会話に応答</text><rect x="64" y="1052" width="1672" height="95" rx="17" fill="#EAF0F6" stroke="#EAF0F6" stroke-width="2"/><text x="900" y="1111" font-size="30" font-weight="500" fill="#426B94" text-anchor="middle">会話ごとに履歴を分離  /  dotは共通  /  完成した返信を約2秒ごとに取得</text></g></svg>